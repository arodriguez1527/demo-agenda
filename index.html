<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F7F8">
<title>Agendar cita médica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F8; --surface:#fff; --ink:#10242B; --ink-2:#3D4F56; --muted:#5B6B72; --faint:#A3B1B6;
  --line:#DCE6E9; --line-2:#E3ECEE; --primary:#1F6F85; --primary-d:#0E3B47; --primary-soft:#E4F1F4; --primary-tint:#F2F9FA;
  --ok:#1E8A5F; --ok-ink:#17694A; --warn-bg:#FFF4E5; --warn-line:#F6D7A7; --warn-ink:#6B3A00; --warn-icon:#8A4B00;
  --radius:18px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(16,36,43,.04),0 8px 24px -12px rgba(16,36,43,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #7CC3D4;outline-offset:2px}
.h-font{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ---------- Estructura ---------- */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1120px;margin:0 auto}
.top{padding:max(16px,env(safe-area-inset-top)) 20px 14px;display:flex;flex-direction:column;gap:16px}
.top-row{display:flex;align-items:center;gap:12px}
.title{font-size:19px;font-weight:800;color:var(--primary-d);letter-spacing:-.01em}
.subtitle{font-size:12px;color:var(--muted);font-weight:500}
.body{flex:1;min-height:0;display:flex}
.view-wrap{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:6px 20px 24px;scrollbar-width:thin;scrollbar-color:#CBD9DD transparent}
.view{display:flex;flex-direction:column;gap:16px;max-width:640px}
.summary{display:none}
.foot{padding:14px 20px max(20px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.hint{font-size:12px;color:var(--muted);text-align:center;min-height:15px}

/* ---------- Controles ---------- */
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s,opacity .2s}
.icon-btn:hover:not(:disabled){background:var(--primary-soft)}
.icon-btn:active:not(:disabled){transform:scale(.94)}
.icon-btn:disabled{opacity:.35}
.cta{width:100%;height:56px;border:0;border-radius:var(--radius);background:var(--primary-d);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .15s,box-shadow .2s;box-shadow:0 10px 24px -12px rgba(14,59,71,.7)}
.cta:hover:not(:disabled){background:var(--primary)}
.cta:active:not(:disabled){transform:scale(.98)}
.cta:disabled{background:#B9C8CD;box-shadow:none}
.link-btn{border:0;background:none;color:var(--primary);font-size:13px;font-weight:700;padding:8px 6px;min-height:36px;border-radius:10px}
.link-btn:hover{background:var(--primary-soft)}

/* ---------- Pasos ---------- */
.steps{display:flex;align-items:flex-start;gap:2px;list-style:none;margin:0;padding:0}
.steps li{flex:1;display:flex}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:2px 0;min-height:52px;border-radius:12px}
.st .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--surface);color:var(--muted);border:1.5px solid #CBD9DD;transition:all .35s var(--ease)}
.st .lbl{font-size:11px;font-weight:500;color:var(--muted);transition:color .3s}
.st.done .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.st.done .lbl{color:var(--primary)}
.st.active .dot{background:var(--primary-d);border-color:var(--primary-d);color:#fff;box-shadow:0 0 0 5px rgba(31,111,133,.18);transform:scale(1.06)}
.st.active .lbl{color:var(--primary-d);font-weight:700}
.st:hover:not(:disabled) .dot{border-color:var(--primary)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;width:20%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#2E93A8);transition:width .5s var(--ease)}

/* ---------- Animaciones ---------- */
.anim-fwd{animation:inR .38s var(--ease) both}
.anim-back{animation:inL .38s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Contenido ---------- */
.h1{margin:0;font-size:24px;font-weight:800;color:var(--primary-d);letter-spacing:-.02em}
.lead{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--primary-soft);color:var(--primary-d);font-size:12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row-k{font-size:12px;color:var(--muted);font-weight:500}
.row-v{font-size:15px;color:var(--ink);font-weight:600}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.ico-box{width:44px;height:44px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}

/* Calendario */
.cal{padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 4px}
.cal-head .icon-btn{width:40px;height:40px;border-radius:12px}
.cal-title{font-size:16px;font-weight:700;color:var(--primary-d)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.day{height:44px;border-radius:12px;border:0;background:transparent;font-size:15px;font-weight:600;transition:background .2s,color .2s,transform .15s;position:relative}
.day:hover:not(:disabled){background:var(--primary-soft)}
.day:active:not(:disabled){transform:scale(.92)}
.day.past{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(163,177,182,.6);font-weight:500}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 1.5px var(--primary)}
.day.today::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--primary)}
.day.sel,.day.sel:hover{background:var(--primary-d);color:#fff;box-shadow:0 6px 14px -6px rgba(14,59,71,.6)}
.day.sel::after{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:10px 4px 0;border-top:1px solid #EEF3F4;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Opciones */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;margin-top:-9px;color:var(--muted);pointer-events:none}
.search .inp{padding-left:42px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:var(--radius);border:1.5px solid var(--line-2);background:var(--surface);transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;min-height:68px}
.opt:hover{border-color:#9FCAD5}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--primary);background:var(--primary-tint);box-shadow:0 0 0 3px rgba(31,111,133,.12)}
.opt .av{width:44px;height:44px;flex:none;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:all .2s}
.opt .av.round{border-radius:50%;width:48px;height:48px}
.opt.sel .av{background:var(--primary);color:#fff}
.opt .txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .name{font-size:15px;font-weight:700}
.opt .meta{font-size:12px;color:var(--muted)}
.opt .avail{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ok-ink);margin-top:1px}
.opt .avail::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid #CBD9DD;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .2s}
.opt.sel .chk{background:var(--primary);border-color:var(--primary);color:#fff}
.empty{margin:0;padding:24px 8px;text-align:center;font-size:14px;color:var(--muted)}

/* Formulario */
.form{display:flex;flex-direction:column;gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid-dob{display:grid;grid-template-columns:.8fr 1fr 1.1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.legend-t{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.legend-t{margin-bottom:8px}
.inp{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;font-family:inherit;color:var(--ink);width:100%;transition:border-color .2s,box-shadow .2s}
.inp::placeholder{color:#8A989D}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(31,111,133,.14)}
.inp.invalid{border-color:#C2410C}
select.inp{padding:0 10px;cursor:pointer}
.help{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.help .err{color:#B3380B;font-weight:600}
.segs{display:flex;gap:10px}
.seg{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .2s}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);transition:all .2s}
.seg:has(input:checked){border-color:var(--primary);background:var(--primary-tint);color:var(--primary-d)}
.seg:has(input:checked) .rd{border:5px solid var(--primary)}
.seg:focus-within{box-shadow:0 0 0 3px #7CC3D4}

/* Comprobante */
.ticket{overflow:hidden}
.ticket-head{background:var(--primary-d);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ticket-no{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#B8D9E1;font-weight:600}
.ticket-num{font-size:24px;font-weight:800;letter-spacing:.04em}
.badge{padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.14);font-size:11px;font-weight:700;white-space:nowrap}
.ticket-sec{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ticket-cut{border-top:2px dashed var(--line);margin:0 18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius);background:var(--warn-bg);border:1px solid var(--warn-line)}
.note p{margin:0;font-size:13px;line-height:1.5;color:var(--warn-ink)}
.success{align-items:center;text-align:center;padding-top:16px}
.success-ico{width:88px;height:88px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(30,138,95,.14),0 16px 30px -12px rgba(30,138,95,.6)}
.success .card{width:100%;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left}
.success .line{display:flex;justify-content:space-between;gap:12px}
.success .line b{font-size:14px;font-weight:600;text-align:right}
.success .note{text-align:left;width:100%}

/* Resumen lateral (escritorio) */
.sum-card{padding:20px;display:flex;flex-direction:column;gap:16px}
.sum-title{margin:0;font-size:16px;font-weight:800;color:var(--primary-d)}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sum-item{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:12px}
.sum-item .mk{width:22px;height:22px;border-radius:50%;border:1.5px solid #CBD9DD;display:flex;align-items:center;justify-content:center;color:transparent;flex:none;margin-top:1px;transition:all .25s}
.sum-item.ok .mk{background:var(--primary);border-color:var(--primary);color:#fff}
.sum-item.cur{background:var(--primary-tint)}
.sum-item .v{font-size:14px;font-weight:600;color:var(--ink);word-break:break-word}
.sum-item .v.empty-v{color:var(--faint);font-weight:500}

/* ---------- Tablet / escritorio ---------- */
@media (min-width:600px){
  .opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{padding-left:32px;padding-right:32px}
  .view-wrap{padding-left:32px;padding-right:32px}
  .foot{padding-left:32px;padding-right:32px}
  .foot .cta{max-width:640px}
  .st .lbl{font-size:12px}
}
@media (min-width:960px){
  body{background:radial-gradient(1200px 600px at 10% -10%,#E3F0F3 0,transparent 60%),var(--bg)}
  .shell{height:auto;min-height:100vh;padding:28px 32px 40px}
  .top{padding:0 0 24px;gap:20px}
  .title{font-size:24px}
  .subtitle{font-size:13px}
  .steps{max-width:720px}
  .st{flex-direction:row;gap:10px;justify-content:flex-start;min-height:44px;padding:4px 8px}
  .st .lbl{font-size:13px}
  .body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
  .view-wrap{overflow:visible;padding:0}
  .view{max-width:none;background:var(--surface);border:1px solid var(--line-2);border-radius:28px;padding:32px;box-shadow:var(--shadow);min-height:560px}
  .view .card{box-shadow:none}
  .h1{font-size:28px}
  .day{height:52px;font-size:16px}
  .summary{display:block;position:sticky;top:28px}
  .summary .sum-card{border-radius:24px}
  .foot{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-row">
      <button class="icon-btn" type="button" id="backBtn" aria-label="Volver al paso anterior">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </button>
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span class="title h-font">Agendar cita</span>
        <span class="subtitle" id="subtitle" aria-live="polite"></span>
      </div>
    </div>
    <nav aria-label="Pasos del agendamiento" style="display:flex;flex-direction:column;gap:12px">
      <ol class="steps" id="steps"></ol>
      <div class="bar" role="progressbar" aria-label="Avance del proceso" aria-valuemin="1" aria-valuemax="5" id="bar"><div class="bar-fill" id="barFill"></div></div>
    </nav>
  </header>

  <div class="body">
    <div class="view-wrap" id="viewWrap">
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <aside class="summary" aria-label="Resumen de la cita">
      <div class="card sum-card">
        <h2 class="sum-title h-font">Resumen de tu cita</h2>
        <ul class="sum-list" id="sumList"></ul>
        <div style="display:flex;flex-direction:column;gap:10px">
          <span class="hint" data-hint></span>
          <button class="cta" type="button" data-cta></button>
        </div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <span class="hint" data-hint></span>
    <button class="cta" type="button" data-cta></button>
  </footer>
</div>

<script>

  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

    cal: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
    right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
    arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
    search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    info: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A4B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top:1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
  };

  /* ===== Estado ===== */
  function initialState() {
    var t = today0();
    return {
      step: 1, max: 1, dir: 1, done: false, q: '',
      vy: t.getFullYear(), vm: t.getMonth(),
      date: null, spec: null, doc: null,
      f: { doc: '', ap: '', am: '', nom: '', d: '1', m: '1', y: '2000', sex: '' },
      touchedDoc: false
    };
  }
  var S = initialState();

  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), viewWrap = $('viewWrap');

  function formOk() {
    var f = S.f;
    return f.doc.length === 10 && f.ap.trim() && f.am.trim() && f.nom.trim() && !!f.sex && dobValid();
  }
  function dobValid() {
    var y = +S.f.y, m = +S.f.m - 1, d = +S.f.d;
    var dt = new Date(y, m, d);
    return dt.getMonth() === m && dt <= today0();
  }
  function age() {
    var t = today0(), by = +S.f.y, bm = +S.f.m - 1, bd = +S.f.d;
    var y = t.getFullYear() - by, m = t.getMonth() - bm;
    if (t.getDate() < bd) m--;
    if (m < 0) { y--; m += 12; }
    return y + (y === 1 ? ' año' : ' años') + (m ? ' ' + m + (m === 1 ? ' mes' : ' meses') : '');
  }
  function patientName() { return [S.f.ap, S.f.am, S.f.nom].map(function (x) { return x.trim(); }).filter(Boolean).join(' '); }

  /* ===== Navegación ===== */
  function goto(n) {
    if (n === S.step && !S.done) return;
    S.dir = n >= S.step ? 1 : -1;
    S.step = n; S.done = false;
    render(true);
  }
  function next() {
    if (S.done) { S = initialState(); S.dir = -1; render(true); return; }
    if (!canContinue()) return;
    if (S.step < 5) { S.dir = 1; S.step++; S.max = Math.max(S.max, S.step); render(true); return; }
    S.done = true; S.dir = 1; render(true);
  }
  function canContinue() {
    if (S.step === 1) return !!S.date;
    if (S.step === 2) return !!S.spec;
    if (S.step === 3) return !!S.doc;
    if (S.step === 4) return formOk();
    return true;
  }

  /* ===== Render: cromo (encabezado, pasos, CTA, resumen) ===== */
  function renderChrome() {
    var cur = S.done ? 6 : S.step;
    $('subtitle').textContent = S.done ? 'Reserva completada' : 'Paso ' + S.step + ' de 5 · ' + LABELS[S.step - 1];
    $('backBtn').disabled = S.done || S.step === 1;
    $('barFill').style.width = (S.done ? 100 : S.step * 20) + '%';
    $('bar').setAttribute('aria-valuenow', S.done ? 5 : S.step);

    $('steps').innerHTML = LABELS.map(function (label, i) {
      var k = i + 1, done = k < cur, active = k === cur, locked = S.done || k > S.max;
      return '<li><button type="button" class="st' + (done ? ' done' : '') + (active ? ' active' : '') + '" data-goto="' + k + '"' + (locked ? ' disabled' : '') +
        (active ? ' aria-current="step"' : '') + ' aria-label="Paso ' + k + ': ' + label + (done ? ' (completado)' : '') + '">' +
        '<span class="dot">' + (done ? I.check : k) + '</span><span class="lbl">' + label + '</span></button></li>';
    }).join('');

    var hint = '';
    if (!S.done && !canContinue()) {
      hint = ['Selecciona un día para continuar', 'Selecciona una especialidad', 'Selecciona un médico', 'Completa todos los datos del paciente'][S.step - 1] || '';
    }
    var label = S.done ? 'Agendar otra cita' : S.step === 5 ? 'Confirmar cita' : S.step === 4 ? 'Revisar reserva' : 'Siguiente';
    document.querySelectorAll('[data-cta]').forEach(function (b) { b.innerHTML = label + I.arrow; b.disabled = !S.done && !canContinue(); });
    document.querySelectorAll('[data-hint]').forEach(function (h) { h.textContent = hint; });

    var spec = specById(S.spec), doc = docById(S.doc), pn = patientName();
    var items = [
      { k: 'Fecha', v: S.date ? fmtLong(S.date) : '', step: 1 },
      { k: 'Especialidad', v: spec ? spec.name : '', step: 2 },
      { k: 'Médico', v: doc ? doc.name : '', step: 3 },
      { k: 'Paciente', v: (S.step > 4 || S.done) && pn ? pn : (S.step === 4 && pn ? pn : ''), step: 4 }
    ];
    $('sumList').innerHTML = items.map(function (it) {
      var ok = !!it.v && (it.step < 4 || formOk());
      return '<li class="sum-item' + (ok ? ' ok' : '') + (!S.done && S.step === it.step ? ' cur' : '') + '"><span class="mk">' + I.check + '</span>' +
        '<span class="kv"><span class="row-k">' + it.k + '</span><span class="v' + (it.v ? '' : ' empty-v') + '">' + (it.v ? esc(it.v) : 'Pendiente') + '</span></span></li>';
    }).join('');
  }

  /* ===== Render: pantallas ===== */
  function heading(t, sub) { return '<div><h1 class="h1 h-font">' + t + '</h1>' + (sub ? '<p class="lead">' + sub + '</p>' : '') + '</div>'; }

  function vCalendar() {
    var t = today0();
    var first = new Date(S.vy, S.vm, 1);
    var offset = (first.getDay() + 6) % 7;
    var dim = new Date(S.vy, S.vm + 1, 0).getDate();
    var total = Math.ceil((offset + dim) / 7) * 7;
    var prevDisabled = S.vy < t.getFullYear() || (S.vy === t.getFullYear() && S.vm <= t.getMonth());
    var cells = '';
    for (var i = 0; i < total; i++) {
      var n = i - offset + 1;
      if (n < 1 || n > dim) { cells += '<span class="day out" aria-hidden="true"></span>'; continue; }
      var d = new Date(S.vy, S.vm, n), id = isoOf(d);
      var past = d < t, isToday = +d === +t, sel = S.date === id;
      cells += '<button type="button" class="day' + (past ? ' past' : '') + (isToday ? ' today' : '') + (sel ? ' sel' : '') + '" data-date="' + id + '"' +
        (past ? ' disabled' : '') + ' aria-pressed="' + sel + '" aria-label="' + fmtLong(id) + (isToday ? ', hoy' : '') + (past ? ', no disponible' : '') + '">' + n + '</button>';
    }
    return heading('¿Qué día quieres tu cita?', 'Puedes elegir hoy o cualquier fecha futura.') +
      '<div class="card cal">' +
        '<div class="cal-head">' +
          '<button class="icon-btn" type="button" data-month="-1" aria-label="Mes anterior"' + (prevDisabled ? ' disabled' : '') + '>' + I.left + '</button>' +
          '<span class="cal-title h-font" aria-live="polite">' + cap(MESES[S.vm]) + ' ' + S.vy + '</span>' +
          '<button class="icon-btn" type="button" data-month="1" aria-label="Mes siguiente">' + I.right + '</button>' +
        '</div>' +
        '<div class="cal-grid" aria-hidden="true"><span class="wd">Lu</span><span class="wd">Ma</span><span class="wd">Mi</span><span class="wd">Ju</span><span class="wd">Vi</span><span class="wd">Sá</span><span class="wd">Do</span></div>' +
        '<div class="cal-grid">' + cells + '</div>' +
        '<div class="legend"><span><i style="box-shadow:inset 0 0 0 1.5px #1F6F85"></i>Hoy</span><span><i style="background:#0E3B47"></i>Seleccionado</span><span><i style="background:#DCE6E9"></i>No disponible</span></div>' +
      '</div>' +
      '<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:14px" aria-live="polite">' +
        '<span class="ico-box">' + I.cal.replace(/16/g, '22') + '</span>' +
        '<span class="kv"><span class="row-k">Fecha seleccionada</span><span class="row-v" style="font-size:16px">' + (S.date ? fmtLong(S.date) : 'Toca un día del calendario') + '</span></span>' +
      '</div>';
  }

  function specItems() {
    var qn = norm(S.q || '');
    var list = SPECS.filter(function (x) { return !qn || norm(x.name).indexOf(qn) >= 0; });
    if (!list.length) return '<p class="empty">No encontramos especialidades con ese nombre.</p>';
    return list.map(function (x) {
      var c = (DOCS[x.id] || []).length, sel = S.spec === x.id;
      return '<button type="button" class="opt' + (sel ? ' sel' : '') + '" data-spec="' + x.id + '" aria-pressed="' + sel + '">' +
        '<span class="av">' + x.ini + '</span><span class="txt"><span class="name">' + x.name + '</span><span class="meta">' + c + (c === 1 ? ' médico disponible' : ' médicos disponibles') + '</span></span>' +
        '<span class="chk">' + I.check + '</span></button>';
    }).join('');
  }
  function vSpecialty() {
    return '<div class="chips" style="justify-content:space-between"><span class="chip">' + I.cal.replace(/16/g, '14') + fmtLong(S.date) + '</span><button type="button" class="link-btn" data-goto="1">Cambiar fecha</button></div>' +
      heading('Elige la especialidad', '¿Qué tipo de atención necesitas?') +
      '<div class="search">' + I.search + '<input class="inp" type="search" id="q" placeholder="Buscar especialidad" aria-label="Buscar especialidad" value="' + esc(S.q) + '" autocomplete="off"></div>' +
      '<div class="opts two" id="specList">' + specItems() + '</div>';
  }

  function vDoctor() {
    var spec = specById(S.spec);
    return '<div class="chips"><span class="chip">' + fmtShort(S.date) + '</span><span class="chip">' + spec.name + '</span><button type="button" class="link-btn" data-goto="2">Cambiar</button></div>' +
      heading('Elige tu médico', 'Profesionales con agenda disponible ese día.') +
      '<div class="opts two">' + docList(S.spec).map(function (d) {
        var sel = S.doc === d.id;
        return '<button type="button" class="opt' + (sel ? ' sel' : '') + '" data-doc="' + d.id + '" aria-pressed="' + sel + '" style="min-height:78px">' +
          '<span class="av round">' + d.ini + '</span><span class="txt"><span class="name">' + d.name + '</span><span class="meta">' + spec.name + '</span><span class="avail">Disponible</span></span>' +
          '<span class="chk">' + I.check + '</span></button>';
      }).join('') + '</div>';
  }

  function options(from, to, sel, labelFn) {
    var out = '', step = from <= to ? 1 : -1;
    for (var v = from; step > 0 ? v <= to : v >= to; v += step) {
      out += '<option value="' + v + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + (labelFn ? labelFn(v) : v) + '</option>';
    }
    return out;
  }
  function vPatient() {
    var f = S.f, spec = specById(S.spec), doc = docById(S.doc), ty = today0().getFullYear();
    var docErr = S.touchedDoc && f.doc.length > 0 && f.doc.length < 10;
    return '<div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px">' +
        '<span style="width:40px;height:40px;border-radius:50%;background:#1F6F85;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none">' + doc.ini + '</span>' +
        '<span class="kv"><span style="font-size:14px;font-weight:700">' + doc.name + '</span><span style="font-size:12px;color:#5B6B72">' + spec.name + ' · ' + fmtShort(S.date) + '</span></span>' +
      '</div>' +
      heading('Datos del paciente', 'Tal como constan en el documento de identidad.') +
      '<form class="form" id="pform" novalidate>' +
        '<div class="fld"><label for="f-doc">Documento del paciente</label>' +
          '<input id="f-doc" class="inp' + (docErr ? ' invalid' : '') + '" data-f="doc" inputmode="numeric" maxlength="10" placeholder="Número de cédula" value="' + esc(f.doc) + '" autocomplete="off" aria-describedby="doc-help">' +
          '<span class="help" id="doc-help"><span class="err" id="doc-err">' + (docErr ? 'Debe tener 10 dígitos' : '') + '</span><span id="doc-count">' + f.doc.length + '/10</span></span></div>' +
        '<div class="grid-2">' +
          '<div class="fld"><label for="f-ap">Apellido paterno</label><input id="f-ap" class="inp" data-f="ap" placeholder="Apellido" value="' + esc(f.ap) + '" autocomplete="family-name"></div>' +
          '<div class="fld"><label for="f-am">Apellido materno</label><input id="f-am" class="inp" data-f="am" placeholder="Apellido" value="' + esc(f.am) + '"></div>' +
        '</div>' +
        '<div class="fld"><label for="f-nom">Nombres</label><input id="f-nom" class="inp" data-f="nom" placeholder="Nombres completos" value="' + esc(f.nom) + '" autocomplete="given-name"></div>' +
        '<fieldset><legend class="legend-t">Fecha de nacimiento</legend><div class="grid-dob">' +
          '<select class="inp" data-f="d" aria-label="Día de nacimiento">' + options(1, 31, f.d, pad) + '</select>' +
          '<select class="inp" data-f="m" aria-label="Mes de nacimiento">' + options(1, 12, f.m, function (v) { return MESES_C[v - 1]; }) + '</select>' +
          '<select class="inp" data-f="y" aria-label="Año de nacimiento">' + options(ty, 1920, f.y) + '</select>' +
        '</div><span class="help" style="margin-top:6px"><span class="err" id="dob-err">' + (dobValid() ? '' : 'Fecha no válida') + '</span><span id="age-txt">' + (dobValid() ? age() : '') + '</span></span></fieldset>' +
        '<fieldset><legend class="legend-t">Sexo</legend><div class="segs">' +
          '<label class="seg"><input type="radio" name="sexo" value="M" data-f="sex"' + (f.sex === 'M' ? ' checked' : '') + '><span class="rd"></span>Masculino</label>' +
          '<label class="seg"><input type="radio" name="sexo" value="F" data-f="sex"' + (f.sex === 'F' ? ' checked' : '') + '><span class="rd"></span>Femenino</label>' +
        '</div></fieldset>' +
      '</form>';
  }

  function vReview() {
    var f = S.f, spec = specById(S.spec), doc = docById(S.doc);
    return heading('Revisa tu reserva', 'Confirma que todo esté correcto.') +
      '<div class="card ticket">' +
        '<div class="ticket-head"><span class="kv"><span class="ticket-no">Agenda N.º</span><span class="ticket-num h-font">' + AGENDA_NO + '</span></span><span class="badge">Por confirmar</span></div>' +
        '<div class="ticket-sec">' +
          '<div class="kv"><span class="row-k">Fecha</span><span class="row-v">' + fmtLong(S.date) + '</span></div>' +
          '<div class="grid-2"><div class="kv"><span class="row-k">Especialidad</span><span class="row-v">' + spec.name + '</span></div><div class="kv"><span class="row-k">Médico</span><span class="row-v">' + doc.name + '</span></div></div>' +
        '</div>' +
        '<div class="ticket-cut"></div>' +
        '<div class="ticket-sec">' +
          '<div class="kv"><span class="row-k">Paciente</span><span class="row-v">' + esc(patientName()) + '</span><span style="font-size:13px;color:#3D4F56">Documento ' + esc(f.doc) + '</span></div>' +
          '<div class="grid-3">' +
            '<div class="kv"><span class="row-k">Nacimiento</span><span class="row-v" style="font-size:14px">' + pad(+f.d) + ' ' + MESES_C[+f.m - 1] + ' ' + f.y + '</span></div>' +
            '<div class="kv"><span class="row-k">Edad</span><span class="row-v" style="font-size:14px">' + age() + '</span></div>' +
            '<div class="kv"><span class="row-k">Sexo</span><span class="row-v" style="font-size:14px">' + (f.sex === 'M' ? 'Masculino' : 'Femenino') + '</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="note">' + I.info + '<p><strong>Tu turno y hora de atención</strong> se emitirán el día de la cita, al registrar tus signos vitales en Enfermería.</p></div>';
  }

  function vDone() {
    var spec = specById(S.spec), doc = docById(S.doc);
    return '<div class="pop success-ico"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>' +
      '<div><h1 class="h1 h-font">¡Cita agendada!</h1><p class="lead">Agenda N.º <strong style="color:#10242B">' + AGENDA_NO + '</strong></p></div>' +
      '<div class="card">' +
        '<div class="line"><span class="row-k">Fecha</span><b>' + fmtLong(S.date) + '</b></div>' +
        '<div class="line"><span class="row-k">Especialidad</span><b>' + spec.name + '</b></div>' +
        '<div class="line"><span class="row-k">Médico</span><b>' + doc.name + '</b></div>' +
        '<div class="line"><span class="row-k">Paciente</span><b>' + esc(patientName()) + '</b></div>' +
      '</div>' +
      '<div class="note">' + I.info + '<p>Preséntate en Enfermería el día de tu cita: allí se registran tus signos vitales y se te asigna el turno y la hora de atención.</p></div>';
  }

  function render(animate) {
    var html = S.done ? vDone() : [vCalendar, vSpecialty, vDoctor, vPatient, vReview][S.step - 1]();
    view.className = 'view' + (S.done ? ' success' : '');
    view.innerHTML = html;
    if (animate) {
      void view.offsetWidth;
      view.classList.add(S.dir < 0 ? 'anim-back' : 'anim-fwd');
      viewWrap.scrollTop = 0;
      if (window.matchMedia('(min-width:960px)').matches) window.scrollTo({ top: 0, behavior: 'smooth' });
      view.focus({ preventScroll: true });
    }
    renderChrome();
  }

  /* ===== Eventos ===== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || t.disabled) return;
    if (t.id === 'backBtn') { if (!S.done && S.step > 1) goto(S.step - 1); return; }
    if (t.hasAttribute('data-cta')) { next(); return; }
    if (t.dataset.goto) { goto(+t.dataset.goto); return; }
    if (t.dataset.date) { S.date = t.dataset.date; render(false); return; }
    if (t.dataset.month) {
      var m = S.vm + (+t.dataset.month), y = S.vy;
      if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
      S.vm = m; S.vy = y; render(false); return;
    }
    if (t.dataset.spec) {
      if (S.spec !== t.dataset.spec) { S.spec = t.dataset.spec; S.doc = null; S.max = Math.min(S.max, 3); }
      $('specList').innerHTML = specItems(); renderChrome(); return;
    }
    if (t.dataset.doc) { S.doc = t.dataset.doc; render(false); return; }
  });

  view.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'q') { S.q = el.value; $('specList').innerHTML = specItems(); return; }
    var k = el.dataset.f; if (!k) return;
    if (k === 'doc') {
      var v = el.value.replace(/\D/g, '').slice(0, 10);
      if (v !== el.value) el.value = v;
      S.f.doc = v;
      $('doc-count').textContent = v.length + '/10';
      if (v.length === 10) { el.classList.remove('invalid'); $('doc-err').textContent = ''; }
    } else if (k !== 'sex') {
      S.f[k] = el.value;
    }
    renderChrome();
  });
  view.addEventListener('change', function (e) {
    var el = e.target, k = el.dataset.f; if (!k) return;
    if (k === 'sex') S.f.sex = el.value;
    else if (k === 'd' || k === 'm' || k === 'y') {
      S.f[k] = el.value;
      $('dob-err').textContent = dobValid() ? '' : 'Fecha no válida';
      $('age-txt').textContent = dobValid() ? age() : '';
    }
    renderChrome();
  });
  view.addEventListener('focusout', function (e) {
    if (e.target.id === 'f-doc') {
      S.touchedDoc = true;
      var bad = S.f.doc.length > 0 && S.f.doc.length < 10;
      e.target.classList.toggle('invalid', bad);
      $('doc-err').textContent = bad ? 'Debe tener 10 dígitos' : '';
    }
  });
  view.addEventListener('submit', function (e) { e.preventDefault(); next(); });
  view.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches('#pform input:not([type=radio])')) { e.preventDefault(); next(); }
  });

  render(false);
})();
</script>
</body>
</html>
